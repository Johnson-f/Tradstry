[package]
name = "tradstry"
version = "0.1.0"
edition = "2024"

[dependencies]
aes-gcm = "0.11.1"
anyhow = "1"
async-graphql = { version = "7.2", features = ["chrono"] }
async-graphql-axum = "7.2"
async-trait = "0.1"
axum = { version = "0.8", features = ["ws"] }
base64 = "0.23"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
dotenvy = "0.15"
futures-channel = { version = "0.3", features = ["sink"] }
futures-util = { version = "0.3", features = ["sink"] }
getrandom = "0.4.3"
hmac = "0.13"
jsonwebtoken = { version = "10", features = ["aws_lc_rs"] }
reqwest = { version = "0.13", default-features = false, features = ["form", "json", "query", "rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "chrono", "uuid", "migrate", "macros", "json", "derive"] }
stytch = "11.1.0"
subtle = "2"
thiserror = "2"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
tower-http = { version = "0.6", features = ["cors", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
url = "2"
uuid = { version = "1.29.0", features = ["serde", "v7"] }

[dev-dependencies]
http-body-util = "0.1"
tokio = { version = "1.54.1", features = ["test-util", "macros", "rt-multi-thread"] }
tokio-tungstenite = "0.30.0"
tower = { version = "0.5", features = ["util"] }
