# Local Postgres for development and tests: `docker compose up -d`.
# Tests create and drop their own databases through #[sqlx::test], so they
# never touch the `tradstry` development database.
services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: tradstry
      POSTGRES_PASSWORD: tradstry
      POSTGRES_DB: tradstry
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tradstry -d tradstry"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  postgres-data:
