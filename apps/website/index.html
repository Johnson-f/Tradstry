<!doctype html>
<html lang="en" class="overscroll-none bg-white dark:bg-neutral-900">
  <head>
    <meta charset="UTF-8" />
    <script>
      try {
        var theme = localStorage.getItem('tradstry:theme')
        document.documentElement.classList.toggle(
          'dark',
          theme === 'dark' ||
            (theme === 'system' && matchMedia('(prefers-color-scheme: dark)').matches),
        )
      } catch {}
    </script>
    <link rel="stylesheet" href="/src/index.css" />
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tradstry</title>
    <meta name="description" content="The trading journal that builds itself. Connect your broker, journal every trade, see what's working, and ask Claude or ChatGPT about your own numbers." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://tradstry.com/" />
    <meta property="og:title" content="Tradstry: the trading journal that builds itself" />
    <meta property="og:description" content="Connect your broker, journal every trade, and see what's actually working." />
    <meta property="og:image" content="https://tradstry.com/landing/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Tradstry: the trading journal that builds itself, with an example dashboard and fox mascot." />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body class="bg-white dark:bg-neutral-900">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
