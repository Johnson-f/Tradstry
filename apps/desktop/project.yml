name: Tradstry
options:
  deploymentTarget:
    macOS: "26.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SYMROOT: "$(PROJECT_DIR)/build"
    OBJROOT: "$(PROJECT_DIR)/build/Intermediates.noindex"
targets:
  Tradstry:
    type: application
    platform: macOS
    sources:
      - Tradstry
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tradstry.desktop
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.finance
        ENABLE_APP_SANDBOX: YES
        ENABLE_HARDENED_RUNTIME: YES
    scheme: {}
