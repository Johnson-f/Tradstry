name: Checks

on:
  workflow_call:
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_USER: tradstry
          POSTGRES_PASSWORD: tradstry
          POSTGRES_DB: tradstry
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tradstry -d tradstry"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      CARGO_TERM_COLOR: always
      DATABASE_URL: postgres://tradstry:tradstry@localhost:5432/tradstry
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: backend
          # Pull requests restore master's cache but never save their own.
          save-if: ${{ github.ref == 'refs/heads/master' }}

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Tests
        run: cargo test --locked

  website:
    name: Website
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/website
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.0

      - name: Install
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Tests
        run: bun run test

      - name: Build
        run: bun run build
