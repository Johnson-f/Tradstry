name: Build and Deploy Production

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tradstry-production
  cancel-in-progress: false

env:
  REGISTRY: docker.io
  BACKEND_IMAGE: johnsonf/tradstry-backend
  SNAPTRADE_IMAGE: johnsonf/snaptrade-service
  MCP_IMAGE: johnsonf/tradstry-mcp
  IMAGE_TAG: sha-${{ github.sha }}

jobs:
  verify:
    uses: ./.github/workflows/commit-check.yml

  build:
    name: Build immutable production images
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      # The build summary stays on the run page; skip the per-build record artifact.
      DOCKER_BUILD_RECORD_UPLOAD: false

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Free disk space for the Rust release build
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Only the compiled-dependency layer is cached, in this repository's private
      # Actions cache. Every step that builds on it must also list it in cache-from:
      # a cache hit here does not load the layer into the builder. It changes only with Cargo.lock, so each deploy reuses one entry
      # instead of leaving its source and build layers behind. The Docker Hub repos are
      # public, so a registry cache would publish the source those layers contain.
      - name: Build Rust dependencies
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./backend
          file: ./devops/docker/backend.Dockerfile
          target: deps
          outputs: type=cacheonly
          cache-from: type=gha,scope=backend-deps
          cache-to: type=gha,scope=backend-deps,mode=min

      - name: Build and push backend
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./backend
          file: ./devops/docker/backend.Dockerfile
          target: backend
          build-contexts: |
            notebook-core=./packages/notebook-core
          cache-from: type=gha,scope=backend-deps
          push: true
          tags: ${{ env.BACKEND_IMAGE }}:${{ env.IMAGE_TAG }}

      - name: Build and push MCP server
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./backend
          file: ./devops/docker/backend.Dockerfile
          target: mcp
          build-contexts: |
            notebook-core=./packages/notebook-core
          cache-from: type=gha,scope=backend-deps
          push: true
          tags: ${{ env.MCP_IMAGE }}:${{ env.IMAGE_TAG }}

      - name: Build and push SnapTrade service
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./microservice/snaptrade-service
          file: ./devops/docker/snaptrade.Dockerfile
          push: true
          tags: ${{ env.SNAPTRADE_IMAGE }}:${{ env.IMAGE_TAG }}

  deploy:
    name: Deploy production
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: Production
      url: https://tradstry.com

    steps:
      - name: Configure production SSH identity
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -d -m 700 "${HOME}/.ssh"
          printf '%s\n' "${DEPLOY_SSH_KEY}" > "${HOME}/.ssh/tradstry_deploy"
          printf '%s\n' "${DEPLOY_KNOWN_HOSTS}" > "${HOME}/.ssh/known_hosts"
          chmod 600 "${HOME}/.ssh/tradstry_deploy" "${HOME}/.ssh/known_hosts"

      - name: Deploy exact commit and image tag
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          ssh \
            -i "${HOME}/.ssh/tradstry_deploy" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "deploy ${GITHUB_SHA} ${IMAGE_TAG}"

  promote:
    name: Promote verified images to latest
    needs: deploy
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Login to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Retags the pushed manifests in the registry; no builder needed.
      - name: Promote verified images to latest
        run: |
          docker buildx imagetools create \
            --tag "${BACKEND_IMAGE}:latest" \
            "${BACKEND_IMAGE}:${IMAGE_TAG}"
          docker buildx imagetools create \
            --tag "${MCP_IMAGE}:latest" \
            "${MCP_IMAGE}:${IMAGE_TAG}"
          docker buildx imagetools create \
            --tag "${SNAPTRADE_IMAGE}:latest" \
            "${SNAPTRADE_IMAGE}:${IMAGE_TAG}"
