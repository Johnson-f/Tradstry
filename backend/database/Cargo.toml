[package]
name = "tradstry-database"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.102"
async-trait = "0.1"
log = "0.4.29"
sea-orm = { version = "=2.0.2", default-features = false, features = ["macros", "sqlx-postgres", "runtime-tokio-rustls", "schema-sync", "entity-registry", "with-chrono", "with-json", "with-rust_decimal", "postgres-array", "postgres-vector"] }
serde_json = "1.0.149"
sqlx = { version = "0.9", features = ["runtime-tokio", "tls-rustls", "postgres", "chrono", "uuid", "rust_decimal"] }
tradstry-migration = { path = "../migration" }

[dev-dependencies]
tokio = { version = "1.50.0", features = ["macros", "rt-multi-thread"] }
uuid = { version = "1", features = ["v4"] }
