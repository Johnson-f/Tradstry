[package]
name = "tradstry-backend"
version = "0.4.6"
edition = "2024"

[workspace]
members = ["database", "migration"]

[dependencies]
tokio = { version = "1.53.2", features = ["full"] }
anyhow = "1.0.104"
log = "0.4.34"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
dotenvy = "0.15.7"
actix-cors = "0.7.2"
actix-web = "4.15.0"
actix-multipart = "0.8.5"
async-graphql = { version = "7.2.1", features = ["dataloader"] }
async-graphql-actix-web = "7.2.1"
async-trait = "0.1"
clerk-rs = { version = "0.5.0", features = ["actix"] }
chrono = { version = "0.4.45", features = ["serde"] }
chrono-tz = "0.10"
uuid = { version = "1.27.0", features = ["v7"] }
finance-query = { version = "3.2.0", features = ["polygon", "fmp"] }
aes-gcm = "0.11.1"
base64 = "0.23.1"
futures-util = "0.3.34"
sqlx = { version = "0.9", features = ["runtime-tokio", "tls-rustls", "postgres", "chrono", "uuid", "rust_decimal"] }
sea-orm = { version = "=2.0.4", default-features = false, features = ["macros", "sqlx-postgres", "runtime-tokio-rustls", "schema-sync", "entity-registry", "with-chrono", "with-json", "with-rust_decimal", "postgres-array", "postgres-vector"] }
tradstry-database = { path = "database" }
rust_decimal = { version = "1.43.0", features = ["serde-with-str"] }
pgvector = { version = "0.4", features = ["sqlx", "halfvec"] }
rustls = { version = "0.23", features = ["ring"] }
redis = { version = "1.7.1", features = ["tokio-comp", "connection-manager"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls", "stream"] }
tokio-stream = { version = "0.1.19", features = ["sync"] }
tonic = { version = "0.14.6", default-features = false, features = ["channel", "codegen"] }
tonic-prost = "0.14.6"
prost = "0.14.4"
tower = { version = "0.5.3", features = ["util"] }
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
thiserror = "2.0.21"
md5 = "0.8.1"
aws-sdk-s3 = { version = "1.152.0", default-features = false, features = ["default-https-client", "http-1x", "rt-tokio"] }
aws-credential-types = "1.3.0"
imagesize = "0.15.0"
sha2 = "0.11.0"
hmac = "0.13.0"
getrandom = "0.4.3"
hyper-util = { version = "0.1.21", features = ["tokio"] }
subtle = "2.6"
hex = "0.4.3"
image = "0.25.10"
tokenizers = { version = "0.23.2", default-features = false, features = ["onig"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
tracing-actix-web = "0.7.25"
sentry = { version = "0.49.3", features = ["tracing"] }
sentry-actix = "0.49.3"
web-push = { version = "0.11.0", default-features = false }
tinyagents = { version = "=2.1.1", features = ["multimodal"] }
unicode-normalization = "0.1"
tempfile = "3.27.0"

[dev-dependencies]
tradstry-migration = { path = "migration" }

[build-dependencies]
prost-build = "0.14.4"
protoc-bin-vendored = "3.2.0"
tonic-prost-build = "0.14.6"
