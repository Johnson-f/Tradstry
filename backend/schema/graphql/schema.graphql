type Query {
	"""
	Active sign-in sessions for the caller.
	"""
	authSessions: [AuthSession!]!
	agentCapabilities: AgentCapabilitiesGql!
	agentConversations(workspaceId: String!, limit: Int): [AgentConversationGql!]!
	agentContextSearch(workspaceId: String!, query: String!, limit: Int): [AgentContextSearchResultGql!]!
	agentMessages(conversationId: String!, limit: Int): [AgentMessageGql!]!
	agentRun(runId: String!): AgentRunGql!
	agentMessageActivity(messageId: String!): AgentMessageActivityGql
	agentMessageActivitySummaries(messageIds: [String!]!): [AgentActivitySummaryGql!]!
	agentMemories(workspaceId: String, includeInactive: Boolean): [AgentMemoryGql!]!
	agentActionProposal(id: String!): AgentActionProposalGql!
	snaptradeOauthAvailable: Boolean!
	snaptradeOauthStatus(attemptId: String!): SnapTradeOAuthStatus
	snaptradeOauthAccounts(attemptId: String!): [BrokerageConnectionAccount!]!
	brokerageTransactionImportPolicy(workspaceId: String!): TransactionImportPolicy
	brokerageReconciliation(workspaceId: String!): BrokerageReconciliation
	brokerageSyncOutcome(workspaceId: String!): BrokerageSyncOutcome
	brokerageTransactions(workspaceId: String!, range: AnalyticsRange, startDate: String, endDate: String, episodeClosedDate: String, transactionType: String, symbol: String, offset: Int, limit: Int, sortBy: String, isJournalled: Boolean): BrokerageTransactionsPage!
	brokerageTransaction(id: String!): BrokerageTransaction
	"""
	Fetch a batch of transactions by id (scoped to the requesting user).
	Used by the pending-trade prefill in the MergeTradesModal.
	"""
	brokerageTransactionsByIds(ids: [String!]!): [BrokerageTransaction!]!
	"""
	Round-trip trade lifecycles that haven't been fully journaled. Groups
	fills across months/years so a position opened in April and closed
	in May shows up as one journaling target.
	"""
	pendingTrades(workspaceId: String!): [PendingTrade!]!
	brokerageHoldings(workspaceId: String!): [BrokerageHolding!]!
	brokerageBalances(workspaceId: String!): [BrokerageBalance!]!
	"""
	Lists every upstream account exposed by this workspace's brokerage
	authorization and whether it is already linked to a Tradstry workspace.
	"""
	brokerageConnectionAccounts(workspaceId: String!): [BrokerageConnectionAccount!]!
	"""
	Returns the current authenticated user.
	Creates the user record and a default account on first access.
	"""
	me: User!
	workspaces: [Workspace!]!
	workspace(id: String!): Workspace
	journalAnalytics(workspaceId: String!, timeFilter: AnalyticsTimeFilterInput!): JournalAnalyticsGql!
	tradingPerformance(workspaceId: String!, timeFilter: AnalyticsTimeFilterInput!): TradingPerformanceGql!
	calendarAnalytics(workspaceId: String!, year: Int!, month: Int!): CalendarAnalyticsGql!
	"""
	With `playbookId` or `tagId`, only trades with that playbook or tag count.
	"""
	advancedAnalytics(workspaceId: String!, timeFilter: AnalyticsTimeFilterInput!, playbookId: String, tagId: String): AdvancedAnalytics!
	playbooks(workspaceId: String!): [PlaybookWithStats!]!
	playbook(id: String!): PlaybookWithStats
	strategyLibraryPlaybooks(statsWorkspaceId: String!): [PlaybookWithStats!]!
	"""
	Offline-first pull for one workspace, with its own cursor. It is separate
	from the notebook pull, while `lastMutationId` remains the shared per-client watermark because
	playbook mutations ride the same outbox/mutation log as the notebook.
	"""
	pullPlaybook(cookie: String, clientId: String!, workspaceId: String!): PlaybookPullResult!
	principles(workspaceId: String!): [PrincipleWithStats!]!
	principle(id: String!): PrincipleWithStats
	"""
	Offline-first pull for the desktop. Workspace-scoped (principles belong
	to one account), with its own cursor. Mirrors `journal::pull_journal`;
	`lastMutationId` is the shared per-client watermark because principle
	mutations ride the same outbox/mutation log as the notebook.
	"""
	pullPrinciple(cookie: String, workspaceId: String!, clientId: String!): PrinciplePullResult!
	userPrompts: [UserPrompt!]!
	journalEntries(workspaceId: String, limit: Int, afterCreatedAt: String, afterId: String): [JournalEntry!]!
	journalEntry(id: String!): JournalEntry
	linkedBrokerageTransactionIds(workspaceId: String!): [String!]!
	tradeViolatedPrincipleIds(journalEntryId: String!): [String!]!
	"""
	Offline-first pull for the desktop. Workspace-scoped (journal entries
	belong to one account, unlike playbooks), with its own cursor.
	`lastMutationId` is the shared per-client watermark because journal
	mutations ride the same outbox/mutation log as the notebook.
	"""
	pullJournal(cookie: String, workspaceId: String!, clientId: String!): JournalPullResult!
	journalSnapshotV2(workspaceId: String!, cursor: String): JournalSnapshotV2!
	journalReviewHistoryV2(workspaceId: String!, entryId: String!): [JournalReviewV2!]!
	journalTradeChartV2(workspaceId: String!, entryId: String!, from: Int, to: Int): JournalTradeChartV2!
	prepareJournalFlow(workspaceId: String!, flatBefore: String): JournalPreparationV2!
	journalGroupingSuggestionsV2(workspaceId: String!, entryId: String, offset: Int! = 0): [JournalGroupingSuggestionV2!]!
	journalFlowStatus(workspaceId: String!): JournalFlowStatus!
	journalTradesV2(workspaceId: String!): [JournalTradeV2!]!
	journalTradeV2(workspaceId: String!, entryId: String!): JournalTradeV2
	journalContextV2(workspaceId: String!, entryId: String!): JournalContextV2!
	journalReviewDraftV2(workspaceId: String!, entryId: String!): JournalReviewDraftV2!
	journalExecutionsV2(workspaceId: String!, entryId: String!): [JournalExecutionV2!]!
	journalGroupingHistoryV2(workspaceId: String!, entryId: String!): [JournalGroupingHistoryV2!]!
	notebookNotes(workspaceId: String): [NotebookNote!]!
	notebookNote(id: String!): NotebookNote
	notebookFolders(workspaceId: String!): [NotebookFolder!]!
	pullNotebook(cookie: String, workspaceId: String!, clientId: String!): NotebookPullResult!
	notebookAccountUpdatesSince(workspaceId: String!, sinceSeq: Int!): [AccountNotebookUpdate!]!
	notebookUpdatesSince(noteId: String!, sinceSeq: Int!): [NotebookUpdate!]!
	"""
	The note's body as Tradstry Markdown, read from its update log.
	"""
	notebookNoteDocument(id: String!): NotebookNoteDocument!
	"""
	Live notes without their bodies, pinned first then most recently updated.
	"""
	notebookNoteSummaries(workspaceId: String!, filter: NotebookNoteFilter, first: Int, after: String): NotebookNoteSummaryPage!
	"""
	Notes whose content matches `query`, best first.
	"""
	searchNotebook(workspaceId: String!, query: String!, limit: Int): [NotebookSearchHit!]!
	notebookFolderNoteCounts(workspaceId: String!): [NotebookFolderNoteCount!]!
	"""
	Notes deleted recently enough to restore, most recent first.
	"""
	deletedNotebookNotes(workspaceId: String!, first: Int, after: String): DeletedNotebookNotePage!
	"""
	Offline-first pull for the desktop. User-scoped, with one cursor
	spanning all three tables (rules + plans + history) — the desktop's
	calculator store syncs all three in a single cycle, exactly like
	`pull_tags`. All three calculator tables are pulled for one workspace.
	"""
	pullCalculator(cookie: String, clientId: String!, workspaceId: String!): CalculatorPullResult!
	positionCalculatorRule(workspaceId: String!): PositionCalculatorRule
	positionCalculatorHistory(workspaceId: String!): [PositionCalculatorHistoryEntry!]!
	positionCalculatorPlans(workspaceId: String!): [PositionCalculatorPlan!]!
	"""
	Broker-derived trade episodes and their explainable plan-match
	suggestions. Suggestions are never applied without confirmation.
	"""
	tradeReviewInbox(workspaceId: String!): [TradeReviewInboxItemGql!]!
	"""
	Read-only calculation preview for a user-selected eligible plan. This
	does not confirm the match or create an immutable review version.
	"""
	tradeReviewPreview(episodeId: String!, planId: String!): String!
	manualExecutionClaims(workspaceId: String!): [ManualExecutionClaimGql!]!
	tagCategories(workspaceId: String!): [TagCategoryGql!]!
	tags(workspaceId: String!, categoryId: String): [TagGql!]!
	strategyLibraryTagCategories: [TagCategoryGql!]!
	strategyLibraryTags(categoryId: String): [TagGql!]!
	"""
	Offline-first pull for the desktop. User-scoped, with one cursor spanning
	BOTH tables (categories + tags) — the desktop's tag store syncs both in a
	single cycle. `lastMutationId` is the shared per-client watermark because
	tag mutations ride the same outbox/mutation log as the notebook/playbook.
	"""
	pullTags(cookie: String, clientId: String!, workspaceId: String!): TagsPullResult!
	marketQuotes(symbols: [String!]!): MarketQuotesGql!
	marketSearch(query: String!): [MarketSearchResultGql!]!
	marketChart(symbol: String!, range: String): [MarketCandleGql!]!
	marketNews(symbol: String!): [MarketArticleGql!]!
	marketFinancials(symbol: String!): JSON!
	marketCompany(symbol: String!): JSON!
	marketTranscriptList(symbol: String!): [MarketTranscriptRefGql!]!
	marketTranscript(symbol: String!, quarter: Int!, year: Int!): MarketTranscriptGql!
	marketWatchlists(workspaceId: String!): [MarketWatchlistGql!]!
	marketReports(workspaceId: String!): [MarketReportGql!]!
	marketMonitors(workspaceId: String!): [MarketMonitorGql!]!
	notifications(limit: Int, before: String): [NotificationGql!]!
	unreadNotificationCount: Int!
	notificationPreferences: [NotificationPreferenceGql!]!
	"""
	Served from the server so the key lives in one place instead of being
	duplicated into frontend build config.
	"""
	webPushPublicKey: String
	notificationSettings: NotificationSettingsGql!
	pushSubscriptions: [PushSubscriptionGql!]!
}

