"""
One group of a breakdown dimension: its key plus the shared core metrics.
"""
type DimensionStat {
	key: String!
	metrics: GroupMetrics!
}

"""
Discipline / process-adherence metrics: the $ cost of flawed trades plus
the self-reported behavioral fields and principle-violation tallies.
"""
type Discipline {
	flawedTradeCount: Int!
	"""
	`clean.expectancy_dollars * flawed_trade_count - flawed.net_profit`: the
	$ the flawed trades cost relative to performing at the clean-trade
	average. Zero when there are no flawed trades.
	"""
	mistakeCost: Float!
	avgRuleAdherence: Float
	avgConviction: Float
	revengeTradeCount: Int!
	broke30MinCount: Int!
	tradesWithViolations: Int!
	totalViolations: Int!
}

"""
Exactly one of `replaceText`, `append`, `rewrite` and `setTitle`.
"""
input EditNotebookNoteInput {
	id: String!
	"""
	The revision the edit was based on. Required for every edit but `append`.
	"""
	expectedRevision: String
	clientId: String!
	mutationId: String!
	"""
	Each `old` must appear exactly once in the note's Markdown.
	"""
	replaceText: [NotebookTextEditInput!]
	append: String
	"""
	The whole note in Tradstry Markdown; only blocks that differ change.
	"""
	rewrite: String
	setTitle: String
}

