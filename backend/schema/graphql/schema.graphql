}

"""
Clean (no mistake-role tag) vs flawed (>=1 mistake-role tag) core metrics,
to expose the $ cost of mistakes (compare net_profit / expectancy).
"""
type CleanFlawed {
	clean: GroupMetrics!
	flawed: GroupMetrics!
}

