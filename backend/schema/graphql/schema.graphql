"""
One update row, tagged with the note it belongs to.
"""
type AccountNotebookUpdate {
	noteId: String!
	seq: Int!
	"""
	base64 of the raw update bytes — the only place they are a `String`.
	"""
	update: String!
}

type AdvancedAnalytics {
	tradeCount: Int!
	netProfit: Float!
	winRate: Float!
	expectancyDollars: Float!
	expectancyR: Float
	rTradeCount: Int!
	"""
	Of those, trades whose stop was typed with a manual trade, so when it was set is unknown.
	"""
	rTypedStopCount: Int!
	profitFactor: Float
	sqn: Float
	"""
	Average realized $ on winning trades (sum winner $ / number of winners).
	"""
	averageGain: Float!
	"""
	Average realized $ on losing trades, as a positive magnitude.
	"""
	averageLoss: Float!
	"""
	Average percent return on winning trades.
	"""
	averageGainPct: Float!
	"""
	Average percent loss on losing trades, as a positive magnitude.
	"""
	averageLossPct: Float!
	maxDrawdownDollars: Float!
	maxDrawdownPct: Float!
	currentDrawdownDollars: Float!
	recoveryFactor: Float
	longestDrawdownDays: Int!
	equityCurve: [EquityPoint!]!
	"""
	Workspace equity at the start of the loaded window (`account_equity -
	net_profit`). Set only when real account equity was supplied; the
	`equity_curve` itself stays in cumulative-PnL terms.
	"""
	startingEquity: Float
	"""
	The account's current total equity passed in (SnapTrade `total_value`).
	None for manual accounts with no synced equity (drawdown % then falls
	back to the peak-cumulative-PnL denominator).
	"""
	accountEquity: Float
	avgPlannedR: Float
	avgActualR: Float
	rDistribution: [Rbucket!]!
	longestWinStreak: Int!
	longestLossStreak: Int!
	currentStreak: Int!
	avgHoldWinnersSecs: Float
	avgHoldLosersSecs: Float
	monthlyWinRateStdev: Float
	bySymbol: [DimensionStat!]!
	byDayOfWeek: [DimensionStat!]!
	bySession: [DimensionStat!]!
	byHolding: [DimensionStat!]!
	byDirection: [DimensionStat!]!
	byPositionSize: [DimensionStat!]!
	byPlaybook: [DimensionStat!]!
	"""
	Pre-trade conviction (1–5) vs outcome, and market-regime performance.
	"""
	byConviction: [DimensionStat!]!
	byMarketRegime: [DimensionStat!]!
	"""
	One group per trading day (`YYYY-MM-DD`, journal time zone) with closed trades.
	"""
	byDay: [DimensionStat!]!
	"""
	One group per trading principle (keyed by principle ID) broken on trades
	in the range. A trade counts toward each principle it broke.
	"""
	byViolatedPrinciple: [DimensionStat!]!
	"""
	What the figures cover: broker and manual trades counted, and trades left out.
	"""
	coverage: TradeCoverage!
	cleanVsFlawed: CleanFlawed!
	"""
	Discipline / process-adherence block: mistake cost plus the
	self-reported behavioral fields and principle-violation tallies.
	"""
	discipline: Discipline!
	"""
	Per-category tag expectancy. One entry per distinct tag category present
	across the trades' tags (seeded tactic/edge categories + any custom
	category). Replaces the old freeform tactic/edge expectancy.
	"""
	tagBreakdowns: [CategoryBreakdown!]!
	tradesPerDay: TradesPerDay!
	"""
	Resolved ET calendar start/end of the active range (`YYYY-MM-DD`).
	`None` for the unbounded `All` range. Set by `get_advanced_analytics`.
	"""
	rangeStart: String
	rangeEnd: String
}

