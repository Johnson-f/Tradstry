	requestPlanExecutionCheck(planId: String!): Int!
	confirmTradeEpisodeMatch(episodeId: String!, planId: String!): String!
	finalizeTradeReview(matchId: String!, reflectionJson: String!, journalDraftJson: String, noAdditionalContext: Boolean! = false): String!
	"""
	Publishes the latest finalized immutable review as a normal journal
