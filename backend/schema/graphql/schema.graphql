type Mutation {
	"""
	Signs out one of the caller's sessions.
	"""
	revokeAuthSession(id: String!): Boolean!
	"""
	Permanently deletes the caller's account and data. Needs a sign-in within
	the last five minutes.
	"""
	deleteAccount: Boolean!
	createAgentConversation(workspaceId: String!): AgentConversationGql!
	renameAgentConversation(conversationId: String!, title: String!): AgentConversationGql!
	deleteAgentConversation(conversationId: String!): Boolean!
	sendAgentMessage(input: SendAgentMessageInput!): AgentRunHandleGql!
	cancelAgentRun(runId: String!): Boolean!
	updateAgentMemory(id: String!, text: String!): AgentMemoryGql!
	setAgentMemoryPinned(id: String!, pinned: Boolean!): AgentMemoryGql!
	forgetAgentMemory(id: String!): Boolean!
	approveAgentAction(proposalId: String!, idempotencyKey: String!): AgentActionProposalGql!
	rejectAgentAction(proposalId: String!): AgentActionProposalGql!
	agentNotebookAutocomplete(title: String!, text: String!): String!
	agentNotebookRewrite(action: AgentRewriteAction!, text: String!): String!
	initiateSnaptradeOauth(workspaceId: String!, platform: String!): SnapTradeOAuthStart!
	finalizeSnaptradeOauthSetup(attemptId: String!, input: FinalizeBrokerageSetupInput!): [Workspace!]!
	completeSnaptradeOauthReauthorization(attemptId: String!): Workspace!
	revokeSnaptradeOauth: SnapTradeOAuthRevocation!
	"""
	Records a user-confirmed data issue with a server-built, sanitized
	diagnostic snapshot. The client never supplies broker payloads, counts,
	account identifiers, or credentials.
	"""
	reportBrokerageDataIssue(input: ReportBrokerageDataIssueInput!): BrokerageDataIssueReport!
	"""
	Replaces an automatic trade grouping with the user's selected broker
	fills. The executions remain immutable; only episode membership changes.
	"""
	regroupBrokerageEpisode(episodeId: String!, transactionIds: [String!]!): String!
	"""
	Removes a manual grouping and returns its fills to deterministic
	brokerage grouping.
	"""
	resetBrokerageEpisodeGrouping(episodeId: String!): Boolean!
	"""
	Registers a SnapTrade user and initiates a brokerage connection.
	Returns only the short-lived portal URL. SnapTrade credentials never leave the backend.
	"""
	initiateBrokerageConnection(workspaceId: String!, brokerageId: String, customRedirect: String, reconnect: Boolean): ConnectionPortal!
	"""
	Completes the connection by storing the connection ID after the user returns from the SnapTrade portal.
	"""
	completeBrokerageConnection(workspaceId: String!, connectionId: String!): Boolean!
	finalizeBrokerageSetup(input: FinalizeBrokerageSetupInput!): [Workspace!]!
	expandBrokerageTransactionHistory(workspaceId: String!, policy: TransactionImportPolicyInput!): TransactionImportPolicy!
	"""
	Creates separate workspaces for selected, currently unlinked accounts
	exposed by the same brokerage authorization as the source workspace.
	"""
	createBrokerageAccountWorkspaces(workspaceId: String!, snaptradeAccountIds: [String!]!): [Workspace!]!
	"""
	Removes the upstream connection before clearing local credentials.
	"""
	disconnectBrokerage(workspaceId: String!): Boolean!
	syncBrokerageData(workspaceId: String!): SyncResult!
	createWorkspace(input: CreateWorkspaceInput!): Workspace!
	updateWorkspace(id: String!, input: UpdateWorkspaceInput!): Workspace!
	deleteWorkspace(id: String!): Boolean!
	createPlaybook(input: CreatePlaybookInput!): PlaybookWithStats!
	updatePlaybook(id: String!, input: UpdatePlaybookInput!): PlaybookWithStats!
	setPlaybookApplicability(id: String!, input: StrategyApplicabilityInput!): PlaybookWithStats!
	deletePlaybook(id: String!): Boolean!
	createPrinciple(input: CreatePrincipleInput!): PrincipleWithStats!
	updatePrinciple(id: String!, input: UpdatePrincipleInput!): PrincipleWithStats!
	deletePrinciple(id: String!): Boolean!
	reorderPrinciples(orderedIds: [String!]!): Boolean!
	createUserPrompt(name: String!, content: String!): UserPrompt!
	updateUserPrompt(id: String!, name: String, content: String): UserPrompt!
	deleteUserPrompt(id: String!): Boolean!
	"""
	Publishes a closed broker-derived episode. Execution facts are loaded
	server-side; only review context is accepted from the client.
	"""
	publishBrokerageEpisodeReview(input: PublishBrokerageEpisodeReviewInput!): String!
	createJournalEntry(input: CreateJournalEntryInput!): JournalEntry!
	updateJournalEntry(id: String!, input: UpdateJournalEntryInput!): JournalEntry!
	deleteJournalEntry(id: String!): Boolean!
	enableJournalFlow(workspaceId: String!, expectedRevision: Int!, flatBefore: String, timezone: String!, clientId: String!, mutationId: String!): JournalActivationV2!
	previewJournalSuggestion(workspaceId: String!, suggestionId: String!, adjustment: JournalGroupingInputV2): JournalGroupingPreviewV2!
	dismissJournalSuggestion(workspaceId: String!, suggestionId: String!, clientId: String!, mutationId: String!): Boolean!
	resetJournalLearning(workspaceId: String!, clientId: String!, mutationId: String!): Boolean!
	previewJournalGrouping(workspaceId: String!, input: JournalGroupingInputV2!): JournalGroupingPreviewV2!
	confirmJournalGrouping(workspaceId: String!, token: String!, clientId: String!, mutationId: String!): JournalGroupingResultV2!
	previewUndoJournalGrouping(workspaceId: String!, operationId: String!): JournalGroupingPreviewV2!
	saveJournalContext(workspaceId: String!, input: JournalContextInputV2!, clientId: String!, mutationId: String!): JournalContextV2!
	ensureJournalContextNote(workspaceId: String!, entryId: String!, clientId: String!, mutationId: String!): String!
	saveJournalReviewDraft(workspaceId: String!, input: JournalReviewDraftInputV2!, clientId: String!, mutationId: String!): JournalReviewDraftV2!
	"""
	Keeps a manual trade held as a possible duplicate as its own trade, so it
	counts from now on and is not flagged against those broker trades again.
	"""
	keepManualTradeSeparate(workspaceId: String!, entryId: String!, expectedVersion: Int!, clientId: String!, mutationId: String!): JournalTradeV2!
	markJournalTradeReviewed(workspaceId: String!, input: JournalFinalizeReviewInputV2!, clientId: String!, mutationId: String!): JournalReviewV2!
	openJournalReviewSession(workspaceId: String!, date: String, refresh: Boolean! = false, expectedVersion: Int, clientId: String!, mutationId: String!): JournalReviewSessionV2
	moveJournalReviewCursor(workspaceId: String!, sessionId: String!, entryId: String!, expectedVersion: Int!, clientId: String!, mutationId: String!): Int!
	createNotebookNote(input: CreateNotebookNoteInput!): NotebookNote!
	updateNotebookNote(id: String!, input: UpdateNotebookNoteInput!): NotebookNote!
	"""
	Toggle a note's star and/or pin flags. Metadata only — leave a flag null to keep it.
	No reindex: star/pin don't change the note's searchable content.
